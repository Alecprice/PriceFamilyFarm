version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    groups:
      next-runtime:
        patterns:
          - next
          - eslint-config-next
          - "@next/*"
      react-runtime:
        patterns:
          - react
          - react-dom
          - "react-server-dom-*"
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: America/New_York
    open-pull-requests-limit: 3
    labels:
      - dependencies
