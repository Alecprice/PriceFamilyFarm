name: Farm site quality

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependency vulnerabilities
        id: dependency_audit
        run: |
          set -o pipefail
          npm audit --audit-level=high 2>&1 | tee dependency-audit.log

      - name: Lint source
        id: lint
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee lint.log

      - name: Validate shell automation syntax
        id: shell
        run: |
          set -o pipefail
          for script in scripts/*.sh; do
            echo "Checking $script"
            bash -n "$script"
          done 2>&1 | tee shell.log

      - name: Farm OS contracts
        id: farm_os
        run: |
          set -o pipefail
          node scripts/verify-farm-os.mjs 2>&1 | tee farm-os.log

      - name: CI workflow contracts
        id: ci_contracts
        run: |
          set -o pipefail
          node scripts/verify-quality-workflow.mjs 2>&1 | tee ci-workflow.log

      - name: Security contracts
        id: security
        run: |
          set -o pipefail
          node scripts/verify-security.mjs 2>&1 | tee security.log

      - name: Cloud Sync contracts
        id: cloud_sync
        run: |
          set -o pipefail
          node scripts/verify-cloud-sync.mjs 2>&1 | tee cloud-sync.log

      - name: Farm sync worker checks
        id: worker
        working-directory: workers/farm-sync
        run: |
          set -o pipefail
          npm ci 2>&1 | tee worker-install.log
          npm test 2>&1 | tee worker-test.log
          npm run bundle:check 2>&1 | tee worker-bundle.log
          npm audit --audit-level=high 2>&1 | tee worker-audit.log

      - name: Report source, security, or worker gate failure
        if: failure() && github.event_name == 'pull_request' && (steps.dependency_audit.outcome == 'failure' || steps.lint.outcome == 'failure' || steps.shell.outcome == 'failure' || steps.farm_os.outcome == 'failure' || steps.ci_contracts.outcome == 'failure' || steps.security.outcome == 'failure' || steps.cloud_sync.outcome == 'failure' || steps.worker.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Automated source/security gate failure"
            echo
            if [ -f dependency-audit.log ]; then
              echo "#### Dependency audit"
              echo '```text'
              tail -n 120 dependency-audit.log
              echo '```'
            fi
            if [ -f lint.log ]; then
              echo "#### Lint"
              echo '```text'
              tail -n 120 lint.log
              echo '```'
            fi
            if [ -f shell.log ]; then
              echo "#### Shell automation"
              echo '```text'
              tail -n 120 shell.log
              echo '```'
            fi
            if [ -f farm-os.log ]; then
              echo "#### Farm OS contracts"
              echo '```text'
              tail -n 120 farm-os.log
              echo '```'
            fi
            if [ -f ci-workflow.log ]; then
              echo "#### CI workflow contracts"
              echo '```text'
              tail -n 120 ci-workflow.log
              echo '```'
            fi
            if [ -f security.log ]; then
              echo "#### Security contracts"
              echo '```text'
              tail -n 120 security.log
              echo '```'
            fi
            if [ -f cloud-sync.log ]; then
              echo "#### Cloud Sync contracts"
              echo '```text'
              tail -n 120 cloud-sync.log
              echo '```'
            fi
            if [ -f workers/farm-sync/worker-install.log ]; then
              echo "#### Farm sync worker install"
              echo '```text'
              tail -n 120 workers/farm-sync/worker-install.log
              echo '```'
            fi
            if [ -f workers/farm-sync/worker-test.log ]; then
              echo "#### Farm sync worker tests"
              echo '```text'
              tail -n 120 workers/farm-sync/worker-test.log
              echo '```'
            fi
            if [ -f workers/farm-sync/worker-bundle.log ]; then
              echo "#### Farm sync worker dry-run bundle"
              echo '```text'
              tail -n 120 workers/farm-sync/worker-bundle.log
              echo '```'
            fi
            if [ -f workers/farm-sync/worker-audit.log ]; then
              echo "#### Farm sync worker audit"
              echo '```text'
              tail -n 120 workers/farm-sync/worker-audit.log
              echo '```'
            fi
          } > /tmp/source-security-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/source-security-comment.md

      - name: Production static build
        id: build
        if: success()
        env:
          NEXT_PUBLIC_SITE_URL: https://price-family-farm.alecjprice.com
          # CI only: the real browser key is injected by the production build environment.
          NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY: 00000000-0000-4000-8000-000000000000
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Report build failure
        if: failure() && steps.build.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Automated build gate failure"
            echo
            echo '```text'
            tail -n 140 build.log
            echo '```'
          } > /tmp/build-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/build-comment.md

      - name: Cache Playwright browsers
        if: success()
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-1.62.1

      - name: Install browser test runner
        if: success()
        id: browser_install
        run: |
          set -o pipefail
          {
            npm install --no-save @playwright/test@1.62.1
            npm audit --audit-level=high
            # The iPhone device profile uses WebKit while tablet/desktop use Chromium.
            # Keep --with-deps even when browser binaries are cached so system requirements remain verified.
            npx playwright install --with-deps chromium webkit
          } 2>&1 | tee browser-install.log

      - name: Serve static export
        if: success()
        id: serve
        run: |
          python3 -m http.server 4173 --directory out > static-server.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat static-server.log
          exit 1

      - name: Responsive and interaction smoke tests
        if: success()
        id: browser
        run: |
          set -o pipefail
          npx playwright test --reporter=line 2>&1 | tee playwright.log

      - name: Report browser-stage failure
        if: failure() && github.event_name == 'pull_request' && (steps.browser_install.outcome == 'failure' || steps.serve.outcome == 'failure' || steps.browser.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Automated browser gate failure"
            echo
            if [ -f browser-install.log ]; then
              echo "#### Browser installation"
              echo '```text'
              tail -n 180 browser-install.log
              echo '```'
            fi
            if [ -f static-server.log ]; then
              echo "#### Static export server"
              echo '```text'
              tail -n 120 static-server.log
              echo '```'
            fi
            if [ -f playwright.log ]; then
              echo "#### Browser tests"
              echo '```text'
              tail -n 180 playwright.log
              echo '```'
            fi
          } > /tmp/browser-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/browser-comment.md

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: farm-site-quality-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            dependency-audit.log
            lint.log
            shell.log
            farm-os.log
            ci-workflow.log
            security.log
            cloud-sync.log
            build.log
            browser-install.log
            static-server.log
            playwright.log
            workers/farm-sync/worker-install.log
            workers/farm-sync/worker-test.log
            workers/farm-sync/worker-bundle.log
            workers/farm-sync/worker-audit.log
            test-results/
            playwright-report/
