name: Farm site quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Farm OS contracts
        run: node scripts/verify-farm-os.mjs
      - name: Production build
        env:
          NEXT_PUBLIC_SITE_URL: https://price-family-farm.alecjprice.com
        run: npm run build
