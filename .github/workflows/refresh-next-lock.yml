name: Refresh patched Next.js lockfile

on:
  push:
    branches: [agents/security-hardening-pass-2026-08-27]
    paths:
      - .github/workflows/refresh-next-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agents/security-hardening-pass-2026-08-27
      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Update patched Next.js release and lockfile
        run: npm install --package-lock-only --save-exact next@15.5.24 eslint-config-next@15.5.24
      - name: Verify no high or critical dependency advisories remain
        run: npm audit --audit-level=high
      - name: Commit generated manifest and lockfile
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency files already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Patch Next.js security advisories"
          git push origin HEAD:agents/security-hardening-pass-2026-08-27
