name: Refresh patched framework lockfile

on:
  push:
    branches: [agents/security-hardening-pass-2026-08-27]
    paths:
      - .github/workflows/refresh-next-lock.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agents/security-hardening-pass-2026-08-27
      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Update patched framework and React releases
        run: npm install --package-lock-only --save-exact next@16.3.3 eslint-config-next@16.3.3 react@19.2.4 react-dom@19.2.4
      - name: Apply compatible transitive audit fixes
        run: npm audit fix --package-lock-only || true
      - name: Capture remaining dependency advisories
        run: npm audit --json > audit.json || true
      - name: Commit generated manifest and lockfile
        run: |
          if ! git diff --quiet -- package.json package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "Upgrade patched Next.js and React runtime"
            git pull --rebase origin agents/security-hardening-pass-2026-08-27
            git push origin HEAD:agents/security-hardening-pass-2026-08-27
          else
            echo "Dependency files already current."
          fi
      - name: Report remaining high or critical advisories
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE' > /tmp/audit-summary.md
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('audit.json', 'utf8'));
          const rows = Object.entries(audit.vulnerabilities || {})
            .filter(([, value]) => ['high', 'critical'].includes(value.severity))
            .map(([name, value]) => `- **${name}** — ${value.severity}; affected: ${value.range}; fix available: ${JSON.stringify(value.fixAvailable)}`);
          console.log('### Dependency audit after framework security upgrade');
          console.log('');
          console.log(rows.length ? rows.join('\n') : 'No high or critical advisories remain.');
          NODE
          gh pr comment 6 --body-file /tmp/audit-summary.md
